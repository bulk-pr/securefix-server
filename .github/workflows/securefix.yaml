---
name: Fix
run-name: Fix (${{ github.event.label.name }})
on:
  label:
    types:
      - created
jobs:
  fix:
    if: startsWith(github.event.label.name, 'securefix-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: main
    permissions:
      issues: write # To delete labels
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            config.yaml
          sparse-checkout-cone-mode: false
      - uses: csm-actions/securefix-action/server/prepare@4d885e1bcb71f4f110215c833002ce9fa0ee0fa6 # v0.6.0
        id: prepare
        with:
          app_id: ${{ vars.DEMO_SERVER_APP_ID }}
          app_private_key: ${{ secrets.DEMO_SERVER_PRIVATE_KEY }}
          config_file: config.yaml
          allow_workflow_fix: true
          workflow_name: ""
      - uses: csm-actions/securefix-action/server/commit@4d885e1bcb71f4f110215c833002ce9fa0ee0fa6 # v0.6.0
        with:
          outputs: ${{ toJson(steps.prepare.outputs) }}
      - uses: csm-actions/securefix-action/server/notify@4d885e1bcb71f4f110215c833002ce9fa0ee0fa6 # v0.6.0
        if: failure()
        with:
          outputs: ${{ toJson(steps.prepare.outputs) }}
