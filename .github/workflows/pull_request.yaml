---
name: test
on: pull_request
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            config.yaml
      - uses: csm-actions/securefix-action/js@4d885e1bcb71f4f110215c833002ce9fa0ee0fa6 # v0.6.0
        with:
          action: validate-config
          config_file: config.yaml
